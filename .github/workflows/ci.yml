name: Integration tests and code generation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew test --no-daemon

  migrate-and-generate:
    runs-on: ubuntu-latest
    env:
      DB_USER: app
      DB_PASSWORD: ci-demo-only-not-production
      MYSQL_ROOT_PASSWORD: ci-local-root-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Start disposable MySQL
        run: docker compose up -d --wait mysql
      - name: Apply Liquibase then generate and compile jOOQ
        run: bash ./gradlew generateJooq compileJava --no-daemon
      - name: Stop disposable MySQL
        if: always()
        run: docker compose down -v
